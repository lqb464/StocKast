[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StocKast"
version = "0.3.0"
description = "Advanced Stock Price Forecasting with Deep Learning, Backtesting, and MLOps"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0,<3",
    "lightgbm>=4.0",
    "torch>=2.0.0",
    "yfinance>=0.2.36",
    "statsmodels>=0.14.0",
    "mlflow>=3.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.14",
    "ta>=0.11.0", # Technical Analysis library for notebooks
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "backend*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
